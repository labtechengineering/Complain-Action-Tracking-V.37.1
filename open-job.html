<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="qa-page" content="job"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>เปิดใบงาน</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=38.0.0"></script><script src="navigation.js?v=43"></script></head><body class="qa-auth-loading"><main style="max-width:600px;margin:90px auto;font-family:Arial,Tahoma,sans-serif"><h2>กำลังเปิดใบงาน...</h2><p id="message">กำลังตรวจสอบประเภทใบงานและสิทธิ์การเข้าถึง</p></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('job')||new URLSearchParams(location.search).get('id');if(!id){document.getElementById('message').textContent='ไม่พบหมายเลขใบงาน';return;}
for(let i=0;i<160&&!QA.profile;i++)await new Promise(r=>setTimeout(r,100));if(!QA.profile)return;
let next='job.html?job='+encodeURIComponent(id);
try{const {data,error}=await QA.client.rpc('qa_vnext_job_detail',{p_job_id:id});if(!error&&Array.isArray(data?.assignments)&&data.assignments.length)next='vnext-job.html?id='+encodeURIComponent(id);}catch{}
location.replace(next);
})();</script></body></html>
