  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      color: #666;
      margin: 6px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px 50px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      padding-bottom: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .required {
      color: red;
    }

    .upload-box {
      border: 2px dashed #bbb;
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      background: #fafafa;
    }

    .upload-box input {
      margin-top: 12px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .preview-item {
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 10px;
      background: white;
    }

    .preview-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .preview-item input {
      margin-bottom: 8px;
    }

    .remove-btn {
      width: 100%;
      padding: 8px;
      background: #eee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .button-area {
      text-align: right;
      margin-top: 25px;
    }

    #submitBtn {
      padding: 13px 30px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #submitBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .success {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    .job-number {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    .upload-status {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }

    @media(max-width:650px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

    }

  </style>

<style>/* V50.2: old header inputs remain as compatibility fields but must not display */
#customerNameInput, #countryInput {display:none!important}
.field:has(> label[for="customerNameInput"]), .field:has(> label[for="countryInput"]) {display:none!important}
</style>
</head>

<body class="qa-auth-loading">

<div class="header">

  <div class="header-inner">

    <h1>Complain &amp; Action Request</h1>

  </div>

</div>

<div class="container">

<div id="messageBox"
     class="message"></div>

<form id="jobForm">
<div class="card"><div class="section-title">1. ข้อมูลการแจ้งเรื่อง</div><div class="grid"><div class="field"><label for="serialNo">Serial Number</label><input id="serialNo" type="text"></div></div></div>
<div class="field" hidden><input id="issuerName" type="text"><input id="fromDepartment" type="text"><select id="toDepartment"></select><input id="customerNameInput"><input id="countryInput"></div>
<div class="card" hidden><select id="category"><option value="">-- เลือกประเภท --</option></select><select id="priority"><option value="NORMAL">NORMAL</option></select><textarea id="problemDetail"></textarea><input id="impact"><input id="location"><input id="downtimeMin" type="number"></div>
<div class="card" hidden><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="previewGrid"></div></div>
<div class="card"><div class="button-area"><button id="submitBtn" type="submit">แจ้งงาน</button></div></div>
</form>

</div>



</body>
