<style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;margin:0;background:#f5f7fb;color:#1f2937}.page{max-width:1040px;margin:auto;padding:22px 14px 70px}.sheet{background:#fff;border:1px solid #e0e5ed;border-radius:13px;padding:20px;margin:15px 0}.row{display:flex;flex-wrap:wrap;gap:12px}.row>*{flex:1;min-width:180px}h1{font-size:24px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px}p{line-height:1.65}.muted{color:#64748b}.field{margin:12px 0}label{display:block;font-weight:700;font-size:14px}textarea,input{font:inherit;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0}textarea{min-height:85px}button,.linkbtn{font:inherit;background:#182336;color:#fff;border:0;padding:10px 14px;margin:5px 5px 5px 0;border-radius:8px;cursor:pointer;display:inline-block;text-decoration:none}.secondary{background:#e9eef5;color:#1f2937}.danger{background:#9f1239}.badge{background:#e5ecf8;padding:6px 10px;border-radius:999px;font-size:12px;display:inline-block}.issue{background:#f8fafc;border-radius:8px;padding:12px;margin:9px 0}.media{display:flex;flex-wrap:wrap;gap:12px}.media-item{width:145px;border:1px solid #e0e5ed;padding:7px;border-radius:9px;overflow:hidden}.media-item img,.media-item video{width:100%;height:90px;object-fit:cover}.media-item a{display:block;font-size:12px;margin-top:6px;word-break:break-all}.vn-status{min-height:20px;font-size:14px}.pdf-only{display:none}@media print{body{background:#fff}.page{padding:0}.sheet{border-radius:0;box-shadow:none;page-break-inside:avoid}.no-print,.qa-sidebar,.qa-mobile-menu-btn{display:none!important}.qa-app-content{margin-left:0!important}.pdf-only{display:block}}.job-tracker{padding:17px 20px}.job-tracker h2{font-size:22px;margin:0 0 18px}.department-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.department-chips button{padding:7px 12px;font-size:12px;background:#f1f5f9;color:#1e293b;border:1px solid #d6e1ed}.department-chips button.active{background:#173052;color:#fff}.sheet[hidden]{display:none!important}.media-note{font-size:12px;color:#344054;white-space:pre-wrap;margin:6px 0}.media-note-input{font-size:12px;min-height:58px}.media-note-save{font-size:11px;padding:6px 9px}.read-text{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;border:1px solid #e2e8f0;padding:10px;border-radius:8px;margin:5px 0 12px;min-height:32px;font-weight:400}.action-note{color:#9f1239;font-size:12px}
.issue-edit-controls[hidden]{display:none!important}.admin-accept-comment{margin:12px 0}.admin-accept-comment textarea{min-height:80px}.history-rows{display:grid;gap:7px}.history-row{font-size:13px;color:#455469;padding:9px 0;border-bottom:1px solid #e2e8f0}.history-row:last-child{border:0}
/* V38: approved compact header, aligned general information, V37-inspired tracker */
.page{max-width:1040px;padding-top:18px}
.job-topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 16px}
.job-topbar h1{font-size:24px;line-height:1.4;margin:0}
.job-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-left:auto}
.job-toolbar button,.job-toolbar .linkbtn{background:#172b49;color:#fff;border:1px solid #172b49;margin:0;padding:10px 16px;border-radius:9px;font-weight:700;white-space:nowrap}
.job-toolbar button:hover,.job-toolbar .linkbtn:hover{background:#263f65}
.job-general-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px;margin-top:18px}
.job-general-field{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-content:start;font-size:14px;line-height:1.65}
.job-general-field .job-general-label{font-weight:700;color:#24334a;white-space:nowrap}
.job-general-field .job-general-value{overflow-wrap:anywhere;white-space:pre-wrap}
.job-general-field.job-general-wide{grid-column:1/-1}
.job-general-field.job-general-date .job-general-label,.job-general-field.job-general-date .job-general-value{color:#64748b;font-weight:400;font-size:13px}
.job-tracker{--track:#2563eb;--done:#15803d;--soft:#dbeafe;padding:20px 20px 18px}
.tracker-stages{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:14px 0 0;margin:18px 0 12px;isolation:isolate}
.tracker-stages::before{content:"";position:absolute;left:12.5%;right:12.5%;height:4px;top:37px;background:#e2e8f0;border-radius:9px;z-index:0}
.tracker-stages::after{content:"";position:absolute;left:12.5%;top:37px;height:4px;width:var(--track-progress,0%);max-width:75%;background:var(--track);border-radius:9px;z-index:0;transition:width .45s ease}
.tracker-stages .track-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;border:0;margin:0;background:transparent;text-align:center;padding:2px 4px 0;color:#94a3b8;font-size:13px;line-height:1.4;font-weight:700;z-index:1}
.tracker-stages .track-node{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid #cbd5e1;background:#f8fafc;color:#8493a7;display:flex;justify-content:center;align-items:center;font-size:20px;box-shadow:0 3px 9px rgba(13,33,65,.05);transition:background .25s ease,transform .25s ease,box-shadow .25s ease}
.tracker-stages .track-stage.done{color:#166534}.tracker-stages .track-stage.done .track-node{background:#f0fdf4;border-color:var(--done);color:var(--done)}
.tracker-stages .track-stage.current{color:#1d4ed8}.tracker-stages .track-stage.current .track-node{background:var(--track);border-color:var(--track);color:#fff;box-shadow:0 0 0 5px var(--soft),0 6px 16px rgba(37,99,235,.22);animation:track-pulse 2.8s ease-in-out infinite}
.tracker-stages .track-stage.current .track-node::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(37,99,235,.25)}
@keyframes track-pulse{0%,100%{box-shadow:0 0 0 5px var(--soft),0 6px 16px rgba(37,99,235,.12)}50%{box-shadow:0 0 0 8px var(--soft),0 8px 20px rgba(37,99,235,.2)}}
@media(max-width:680px){.job-topbar{align-items:flex-start;flex-wrap:wrap}.job-toolbar{width:100%;justify-content:flex-end}.job-general-grid{grid-template-columns:1fr;gap:10px}.tracker-stages .track-node{width:39px;height:39px;font-size:17px}.tracker-stages::before,.tracker-stages::after{top:32px}.tracker-stages .track-stage{font-size:11px}}
@media print{.job-topbar{margin-bottom:12px}.tracker-stages .track-stage.current .track-node{animation:none}.job-general-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.head-review-alert{display:inline-block;padding:7px 11px;background:#fff0c2;border:1px solid #eecb73;border-radius:7px;color:#8a4b00}
/* V50.4: external action bar only; form fields and section 3 remain unchanged */
.department-action-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:1px 4px 13px;margin:-5px 0 12px}
.department-action-bar button{min-height:43px;padding:11px 18px;font-weight:700;border-radius:9px;transition:background-color .12s ease,transform .08s ease,box-shadow .12s ease;box-shadow:0 3px 0 rgba(12,28,55,.25);margin:2px 0}
.department-action-bar button:hover:not(:disabled){filter:brightness(.93)}
.department-action-bar button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 rgba(12,28,55,.25)}
.department-action-bar button:disabled{cursor:wait;opacity:.62;box-shadow:none;transform:translateY(2px)}
.department-action-bar button[aria-busy="true"]{background:#64748b;color:white}
@media print{.department-action-bar{display:none!important}}
/* V50.8: immutable prior correction records with a new editing round */
.response-prior-round{border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:14px 18px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.response-prior-round h3{margin:0 0 10px}
.response-prior-round p{margin:8px 0;line-height:1.6}
.rework-reminder{color:#b91c1c;font-weight:400}
.issue-department-group,.department-panel{scroll-margin-top:110px}.issue-dept-highlight{outline:2px solid #2563eb;outline-offset:4px;border-radius:8px}.rework-unarchived{background:#fffbeb;border:1px solid #f59e0b;color:#92400e;border-radius:9px;padding:12px;margin:10px 0;font-size:13px;font-weight:400}.unrelated-decision{border:2px solid #eab308;background:#fffbeb;border-radius:10px;padding:15px;margin:15px 0}.unrelated-decision h4{margin:0 0 8px;color:#92400e}.unrelated-decision-buttons{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.unrelated-decision button{min-height:42px}.unrelated-change-form{border-top:1px solid #e8cf81;margin-top:10px;padding-top:13px}.unrelated-change-form[hidden]{display:none!important}.unrelated-explanation{overflow-wrap:anywhere}</style></head>
