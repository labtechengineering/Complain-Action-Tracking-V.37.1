<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="qa-page" content="dashboard"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Complain</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=38.0.0"></script><script src="navigation.js?v=38.0.0"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#192534;font:15px Arial,Tahoma,sans-serif}.main{max-width:1210px;padding:24px 18px 55px;margin:auto}header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 5px;font-size:26px}.muted,#feedback{color:#627083;font-size:13px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0}select,input,button{border:1px solid #cbd5e1;padding:10px 12px;border-radius:9px;font:inherit;background:white}button{cursor:pointer;background:#19283d;color:white}button:hover{opacity:.91}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.card,.chart{background:#fff;border:1px solid #e1e8ef;border-radius:13px;padding:17px}.number{font-size:32px;font-weight:800;margin-top:10px}.chart{margin-top:14px;overflow:hidden}.key{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0 22px}.key span{display:flex;align-items:center;gap:6px;font-size:13px}.dot{width:12px;height:12px;display:inline-block;border-radius:2px}.graph{display:flex;gap:8px;min-height:355px}.axis{width:30px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;height:280px;font-size:12px;color:#64748b;flex-shrink:0}.plot{display:flex;align-items:flex-end;justify-content:space-around;gap:14px;min-height:330px;flex:1;overflow-x:auto;border-bottom:1px solid #d6dee8}.item{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:85px;max-width:165px;height:330px}.columns{width:min(75%,82px);display:flex;flex-direction:column-reverse;overflow:hidden;min-height:0}.segment{min-height:0;display:flex;justify-content:center;align-items:center;color:white;font-weight:800;font-size:13px}.total{font-weight:800;margin-bottom:7px}.dept{font-weight:700;font-size:12px;margin-top:10px;text-align:center;min-height:37px;overflow-wrap:anywhere}@media(max-width:740px){.cards{grid-template-columns:repeat(2,1fr)}.main{padding:14px 10px}.number{font-size:26px}.item{min-width:67px}.chart{padding:12px}}.filter-card{cursor:pointer;transition:border-color .15s,background .15s}.filter-card:hover{border-color:#94a3b8}.filter-card.active{border:2px solid #334155;background:#f8fafc}
.segment{cursor:pointer}.segment:hover{filter:brightness(1.08)}.segment:focus-visible{outline:2px solid #1e293b;outline-offset:-2px}
.filtered{margin:15px 0;background:#fff;border:1px solid #e1e8ef;border-radius:13px;padding:15px}.filtered-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.filtered-results{display:grid;gap:8px}.filtered-card{display:flex;justify-content:space-between;gap:12px;text-decoration:none;color:#192534;padding:12px 14px;border:1px solid #e2e8f0;border-radius:9px}.filtered-card:hover{background:#f8fafc}.filtered-card small{color:#64748b}.filter-close{background:#e2e8f0;color:#24334b}.filtered-empty{color:#64748b;font-size:13px;padding:12px}
</style></head>
<body class="qa-auth-loading"><main class="main"><header><div><h1>Complaint &amp; Action Request Dashboard</h1><div class="muted">สรุปงานตามฝ่ายรับเรื่อง (หนึ่งเลขงานต่อหนึ่งฝ่าย = หนึ่งงาน)</div></div></header>
<div class="controls"><label for="filter">ช่วงเวลา</label><select id="filter"><option value="all">ทั้งหมด</option><option value="day">รายวัน</option><option value="week">รายสัปดาห์</option><option value="month">รายเดือน</option><option value="year">รายปี</option></select><input id="day" type="date" hidden><input id="week" type="week" hidden><input id="month" type="month" hidden><input id="year" type="number" min="2020" max="2100" hidden><button id="refresh">แสดงข้อมูล</button><button type="button" id="exportExcel" hidden style="background:#166534">Export Excel (.xlsx)</button></div><p id="period" class="muted"></p>
<div class="cards"><section class="card filter-card" data-status="all" role="button" tabindex="0"><div>งานทั้งหมด</div><div id="nTotal" class="number">—</div></section><section class="card filter-card" data-status="IN_PROGRESS" role="button" tabindex="0"><div>กำลังดำเนินการ</div><div id="nProgress" class="number">—</div></section><section class="card filter-card" data-status="WAITING_REVIEW" role="button" tabindex="0"><div>รอตรวจสอบ</div><div id="nReview" class="number">—</div></section><section class="card filter-card" data-status="CLOSED" role="button" tabindex="0"><div>สำเร็จ</div><div id="nDone" class="number">—</div></section></div>
<section class="chart"><h2>จำนวนงานแยกตามฝ่ายรับเรื่อง</h2><div class="key"><span><i class="dot" style="background:#F59E0B"></i>กำลังดำเนินงาน</span><span><i class="dot" style="background:#3B82F6"></i>รอตรวจสอบ</span><span><i class="dot" style="background:#16A34A"></i>สำเร็จ</span></div><div class="graph"><div id="axis" class="axis"></div><div id="plot" class="plot"></div></div></section><section id="filtered" class="filtered" hidden><div class="filtered-header"><strong id="filteredTitle"></strong><button type="button" id="closeFiltered" class="filter-close">ปิดรายการ</button></div><div id="filteredResults" class="filtered-results"></div></section><p id="feedback" role="status"></p></main><script src="vnext-dashboard.js?v=38.0.0" defer></script></body></html>
