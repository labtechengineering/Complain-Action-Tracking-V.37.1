/* V50.3: Dashboard latest-issues table only. */
.listpanel .list-scroll{overflow-x:auto;}
.listpanel .list-table{min-width:1100px;width:100%;}
.listpanel .list-columns,.listpanel .job-row{
  display:grid!important;
  grid-template-columns:48px minmax(175px,1.55fr) minmax(105px,0.9fr) minmax(130px,1.2fr) minmax(98px,0.9fr) minmax(195px,2.3fr) minmax(142px,1.35fr) minmax(142px,1.2fr)!important;
  align-items:center;
  column-gap:12px;
}
.listpanel .list-columns>span,.listpanel .job-row>span{min-width:0;}
.listpanel .job-row>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.listpanel .job-row>span:nth-child(6){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.listpanel .job-row>span:nth-child(7){overflow:visible;white-space:normal;}
.listpanel .job-row>span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;}
.listpanel .head-approval-flag{display:inline-flex;align-items:center;margin:4px 0 0 0;padding:3px 7px;font-size:11px;line-height:1.2;max-width:100%;white-space:nowrap;}
.listpanel .head-approval-flag{display:block!important;background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;margin:5px 0 0!important;color:#dc2626!important;font-size:12px!important;font-weight:400!important;white-space:nowrap!important}
.listpanel .read-column{display:flex;align-items:center;justify-content:center;font-size:11px}
.read-state{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;flex-shrink:0}
.read-state.unread{background:#e9f0f8;color:#375b81}.read-state.read{color:#8a98a9}.read-state.unknown{color:#94a3b8}
.workflow-notice{display:flex;align-items:flex-start;gap:5px;margin-top:5px;font-size:12px;line-height:1.4;white-space:normal}.workflow-notice svg{flex-shrink:0;margin-top:1px}.workflow-notice.action-required{color:#b42318}.workflow-notice.informative{color:#64748b}</style></head><body class="qa-auth-loading dashboard-compact"><main class="main">
