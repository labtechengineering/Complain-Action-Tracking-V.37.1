<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="qa-page" content="dashboard"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Complain V39</title>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-api.js?v=39"></script><script src="navigation.js?v=38.0.0"></script>
<link rel="stylesheet" href="v39.css?v=39"></head><body class="qa-auth-loading"><main class="main">
<header><div><h1>Complaint &amp; Action Request Dashboard</h1><p id="welcome" class="welcome">ยินดีต้อนรับเข้าสู่ระบบจัดการงาน</p></div><a class="toplink" href="customer.html">ค้นหาข้อมูลลูกค้า →</a></header>
<div class="controls"><label for="dashScope">ขอบเขตงาน</label><select id="dashScope"><option value="all">ทุกแผนกที่มีสิทธิ์ดู</option><option value="received">งานเข้าแผนก</option><option value="mine">งานที่ฉันแจ้ง</option><option value="department_sent">งานที่แผนกแจ้ง</option><option value="review">รอตรวจสอบ</option><option value="closed">ปิด / ยกเลิกแล้ว</option></select><label for="filter">ช่วงเวลา</label><select id="filter"><option value="all">ทั้งหมด</option><option value="day">รายวัน</option><option value="week">รายสัปดาห์</option><option value="month">รายเดือน</option><option value="year">รายปี</option></select><input id="day" type="date" hidden><input id="week" type="week" hidden><input id="month" type="month" hidden><input id="year" type="number" min="2020" max="2100" hidden><input id="dashSearch" type="search" placeholder="ค้นหาเลขงาน ผู้แจ้ง เครื่อง ปัญหา หรือแผนก" aria-label="ค้นหางาน"><button id="refresh" type="button">แสดงข้อมูล</button></div><p id="period" class="muted"></p>
<div class="cards"><button class="stat active" data-status="all"><span>งานทั้งหมด</span><strong id="nTotal">—</strong></button><button class="stat" data-status="IN_PROGRESS"><span>กำลังดำเนินการ</span><strong id="nProgress">—</strong></button><button class="stat" data-status="WAITING_REVIEW"><span>รอตรวจสอบ</span><strong id="nReview">—</strong></button><button class="stat" data-status="CLOSED"><span>สำเร็จ</span><strong id="nDone">—</strong></button></div>
<div class="charts"><section class="panel barpanel"><h2>จำนวนงานแยกตามฝ่ายรับเรื่อง</h2><div id="barLegend" class="legend"></div><div class="bargraph"><div id="axis" class="axis"></div><div id="plot" class="plot"></div></div></section><section class="panel donutpanel"><h2>สัดส่วนสถานะงาน</h2><div class="donut-layout"><div class="donut-wrap"><div id="donut" class="donut"><div class="donut-center"><strong id="donutTotal">0</strong><small>งานทั้งหมด</small></div></div></div><div id="donutLegend" class="donut-legend"></div></div></section></div>
<section class="panel listpanel"><div class="listhead"><div><h2 id="listTitle">งานแจ้งล่าสุด</h2><p class="muted">เรียงตามวันเวลาที่แจ้งล่าสุด · จากแผนก → ถึงแผนก</p></div><button id="viewAll" class="secondary" type="button">ดูงานทั้งหมด</button></div><div class="list-scroll"><div class="list-table"><div class="list-columns"><span>เลขที่งาน</span><span>ผู้แจ้ง</span><span>เครื่อง / Serial</span><span>จาก → ถึงแผนก</span><span>ปัญหา</span><span>สถานะ</span><span>วันที่แจ้ง</span></div><div id="jobRows"></div></div></div><div class="pagination" id="pagination" hidden><button id="prevPage" type="button" class="secondary">← ก่อนหน้า</button><span id="pageInfo"></span><button id="nextPage" type="button" class="secondary">ถัดไป →</button></div></section><p role="status" id="feedback" class="muted"></p></main><script src="v39-dashboard.js?v=39" defer></script></body></html>
